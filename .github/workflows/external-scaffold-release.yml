name: External scaffold release gate

on:
  workflow_dispatch:
    inputs:
      implementation_ref:
        description: Public implementation branch, tag, or commit to scaffold and verify
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  external-scaffold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 20
          - os: windows-latest
            timeout_minutes: 40
          - os: macos-latest
            timeout_minutes: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      TEMPLATE_REPOSITORY: ${{ github.repository }}
      IMPLEMENTATION_REF: ${{ inputs.implementation_ref }}

    steps:
      - name: Checkout pinned public implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.implementation_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 20.18.3
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - name: Prepare empty external scaffold directory
        shell: bash
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING prepare=%ds\n" "$((SECONDS - step_started))"' EXIT
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            runner_temp_path="$(cygpath -u "$RUNNER_TEMP")"
            source_root="$(cygpath -u "$GITHUB_WORKSPACE")"
            github_env_path="$(cygpath -u "$GITHUB_ENV")"
          else
            runner_temp_path="$RUNNER_TEMP"
            source_root="$GITHUB_WORKSPACE"
            github_env_path="$GITHUB_ENV"
          fi
          RELEASE_ROOT="$runner_temp_path/quoteproof-external-scaffold"
          RELEASE_LOG_DIR="$RELEASE_ROOT/logs"
          printf 'RELEASE_ROOT=%s\nRELEASE_LOG_DIR=%s\nSOURCE_ROOT=%s\n' \
            "$RELEASE_ROOT" "$RELEASE_LOG_DIR" "$source_root" >> "$github_env_path"
          # The upstream CLI creates an initial local commit in the generated app.
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          case "$IMPLEMENTATION_REF" in
            (''|*[!A-Za-z0-9._/-]*)
              printf 'implementation_ref contains unsupported characters\n' >&2
              exit 1
              ;;
          esac
          case "$TEMPLATE_REPOSITORY" in
            (*'/'*'/'*|''|*[!A-Za-z0-9._/-]*)
              printf 'github.repository is not a public owner/repository identifier\n' >&2
              exit 1
              ;;
          esac
          mkdir -p "$RELEASE_ROOT"
          test -z "$(ls -A "$RELEASE_ROOT")"
          mkdir -p "$RELEASE_LOG_DIR"
          {
            printf 'repository=%s\n' "$TEMPLATE_REPOSITORY"
            printf 'requested_ref=%s\n' "$IMPLEMENTATION_REF"
            printf 'checked_out_commit='
            git rev-parse HEAD
          } | tee "$RELEASE_LOG_DIR/source-ref.log"

      - name: Scaffold from public repository with CLI 0.4.0
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING scaffold=%ds\n" "$((SECONDS - step_started))"' EXIT
          npx --yes create-scaffold-hbar@0.4.0 app \
            --template "$TEMPLATE_REPOSITORY#$IMPLEMENTATION_REF" \
            --frontend nextjs-app \
            --solidity-framework hardhat \
            --network testnet \
            --package-manager "npm" \
            --ci \
            --skip-hedera-skills \
            --skip-install 2>&1 | tee "$RELEASE_LOG_DIR/cli-output.log"

      - name: Verify generated source provenance
        shell: bash
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING provenance=%ds\n" "$((SECONDS - step_started))"' EXIT
          app="$RELEASE_ROOT/app"
          node - "$SOURCE_ROOT/package.json" "$app/package.json" <<'NODE'
          const fs = require("node:fs");
          const normalize = value => {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map(key => [key, normalize(value[key])]));
            }
            return value;
          };
          const [sourcePath, generatedPath] = process.argv.slice(2);
          const source = normalize(JSON.parse(fs.readFileSync(sourcePath, "utf8")));
          const generated = normalize(JSON.parse(fs.readFileSync(generatedPath, "utf8")));
          if (JSON.stringify(source) !== JSON.stringify(generated)) {
            console.error("generated package.json differs from the checked-out package.json");
            process.exit(1);
          }
          NODE
          for path in \
            AGENTS.md \
            package-lock.json \
            packages/hardhat/contracts/QuoteProofRegistry.sol \
            packages/hardhat/utils/quoteReceipt.ts \
            packages/hardhat/utils/quoteReceiptComparison.ts \
            packages/hardhat/scripts/demoCases.ts \
            packages/hardhat/scripts/verifyQuote.ts \
            packages/nextjs/app/api/quote/preview/route.ts \
            packages/nextjs/app/api/quote/compare/route.ts \
            examples/receipt-testnet.json \
            examples/adversarial/genuine.json \
            examples/adversarial/simple-tamper-tinybars-plus-one.json \
            examples/adversarial/recomputed-cents-1000.json \
            examples/adversarial/recomputed-double-price.json \
            docs/local-policy-workshop.md \
            docs/local-policy-3600.patch \
            scripts/check-local-policy-workshop.mjs \
            scripts/ci-smoke-server.mjs \
            scripts/release-smoke.mjs \
            scripts/demo.mjs \
            scripts/demo.test.mjs; do
            cmp "$SOURCE_ROOT/$path" "$app/$path"
          done
          test ! -e "$app/template.json"
          printf 'Generated implementation matches the checked-out public commit for release-critical files; template.json removal is the expected CLI transform.\n' \
            | tee "$RELEASE_LOG_DIR/provenance.log"

      - name: Install generated scaffold dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold/app
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING install=%ds\n" "$((SECONDS - step_started))"' EXIT
          npm ci 2>&1 | tee "$RELEASE_LOG_DIR/npm-ci.log"

      - name: Compile, test, type-check, lint, and build generated scaffold
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold/app
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING deterministic_checks=%ds\n" "$((SECONDS - step_started))"' EXIT
          {
            npm run hardhat:compile
            npm run hardhat:test
            npm run demo -- --offline
            npm run demo:test
            npm run hardhat:check-types
            npm run hardhat:lint -- --max-warnings=0
            npm run next:check-types
            npm run next:lint -- --max-warnings=0
            npm run next:build
          } 2>&1 | tee "$RELEASE_LOG_DIR/deterministic-checks.log"

      - name: Exercise local mock policy workshop on generated scaffold
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold/app
        run: |
          set -euo pipefail
          step_started=$SECONDS
          trap 'printf "CI_TIMING mock_workshop=%ds\n" "$((SECONDS - step_started))"' EXIT
          node scripts/check-local-policy-workshop.mjs 2>&1 | tee "$RELEASE_LOG_DIR/local-policy-workshop.log"

      - name: Run bounded read-only production API smoke checks
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold/app
        env:
          RELEASE_SMOKE_BASE_URL: http://127.0.0.1:3002
        run: |
          set -euo pipefail
          node "$SOURCE_ROOT/scripts/ci-smoke-server.mjs" production

      - name: Smoke test README dev mode on generated scaffold
        shell: bash
        working-directory: ${{ runner.temp }}/quoteproof-external-scaffold/app
        run: |
          set -euo pipefail
          node "$SOURCE_ROOT/scripts/ci-smoke-server.mjs" dev

      - name: Upload selected public release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-scaffold-release-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/cli-output.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/source-ref.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/provenance.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/npm-ci.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/deterministic-checks.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/production-server.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/smoke.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/dev-server.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/dev-smoke.log
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/production-timing.json
            ${{ runner.temp }}/quoteproof-external-scaffold/logs/dev-timing.json
